# Render Blueprint: Dashboard > New > Blueprint > pick this repository.
services:
  - type: web
    name: gold-platform-api
    runtime: python
    plan: free                 # free instances sleep after inactivity; see docs/DEPLOY.md
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: gold-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: FRONTEND_ORIGIN       # your Vercel address, e.g. https://gold-platform.vercel.app
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
databases:
  - name: gold-db
    plan: free                 # free databases are deleted after a limited period; use a paid plan or an external Postgres for real use
